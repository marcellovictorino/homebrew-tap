name: update
# Keeps opted-in formulas on their project's latest GitHub release.
# Uses only this workflow's own GITHUB_TOKEN; no secrets.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
concurrency:
  group: update
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update formulas
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/update-formulas.sh
      - name: Prove the updated formulas build
        if: steps.update.outputs.changed == '1'
        run: .github/scripts/git diff --name-only -z -- Formula | xargs -0 .github/scripts/check-formulas.sh
      - name: Commit
        if: steps.update.outputs.changed == '1'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          names=$(git diff --name-only -- Formula | xargs -n1 basename | sed 's/\.rb$//' | paste -sd, -)
          git commit -am "chore($names): update to the latest release"
          git push origin HEAD:main
