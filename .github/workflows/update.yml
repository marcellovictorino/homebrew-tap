name: update
# Keeps opted-in formulas on their project's latest GitHub release.
# Uses only this workflow's own GITHUB_TOKEN; no secrets.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
concurrency:
  group: update
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # Each formula is updated, built and committed on its own, so one that
      # fails its release lookup or its build does not hold back the others.
      # The run still ends failed, naming each formula left behind.
      - name: Update, check and commit each formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          .github/scripts/update-tap.sh
