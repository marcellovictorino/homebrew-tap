name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tap:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Updater script test
        run: .github/scripts/test-update-formulas.sh
      - name: Per-formula updater test
        run: .github/scripts/test-update-tap.sh
      # Audits, builds and tests every formula; fails on a formula whose release
      # is not tagged yet (all-zero placeholder checksum).
      - name: Check formulas
        run: .github/scripts/check-formulas.sh
