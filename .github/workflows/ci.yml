name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tap:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Updater script test
        run: .github/scripts/test-update-formulas.sh
      - name: Audit formulas
        run: |
          brew tap marcellovictorino/tap "$GITHUB_WORKSPACE"
          brew audit --strict --tap marcellovictorino/tap
